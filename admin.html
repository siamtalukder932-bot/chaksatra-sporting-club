
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel | Chaksatra Sporting Club</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:Arial,sans-serif;background:#f2f5f2;color:#183328;margin:0;padding:20px}
    main{max-width:1000px;margin:25px auto;background:white;padding:24px;border-radius:14px}
    h1{color:#16834a}input,button{padding:12px;margin:6px 0;box-sizing:border-box}
    input{width:100%;border:1px solid #ccd5ce;border-radius:7px}
    button{background:#16834a;color:white;border:0;border-radius:7px;cursor:pointer}
    .hidden{display:none}
    .table-wrap{overflow-x:auto}
    table{border-collapse:collapse;width:100%;margin-top:20px}
    th,td{padding:10px;border:1px solid #dce3de;text-align:left}
    th{background:#e8f4eb}
    #message{white-space:pre-wrap}
  </style>
</head>
<body>
<main>
  <h1>Chaksatra Sporting Club</h1>
  <h2>Admin Login</h2>

  <form id="loginForm">
    <label>Email</label>
    <input id="email" type="email" required autocomplete="username">
    <label>Password</label>
    <input id="password" type="password" required autocomplete="current-password">
    <button type="submit">Login</button>
  </form>

  <p id="message" role="status"></p>

  <section id="dashboard" class="hidden">
    <hr>
<h2>Tournament Management</h2>

<form id="tournamentForm">
  <input
    id="tournamentTitle"
    placeholder="Tournament Name"
    required
  >

  <input
    id="tournamentSport"
    placeholder="Sport (e.g. Badminton)"
    required
  >

  <input
    id="tournamentFee"
    type="number"
    min="0"
    placeholder="Registration Fee"
    value="0"
    required
  >

  <input
    id="tournamentDeadline"
    type="date"
  >

  <textarea
    id="tournamentDescription"
    placeholder="Tournament Description"
  ></textarea>

  <button type="submit">Add Tournament</button>
</form>

<p id="tournamentMessage" role="status"></p>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Sport</th>
        <th>Fee</th>
        <th>Deadline</th>
        <th>Published</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="tournamentRows"></tbody>
  </table>
</div>
    <h2>Registration Dashboard</h2>
    <button id="refreshButton" type="button">Refresh registrations</button>
    <button id="logoutButton" type="button">Logout</button>
    <p id="count">Registrations: 0</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Mobile</th>
            <th>Player Type</th>
            <th>Tournament ID</th>
            <th>Address</th>
            <th>Message</th>
              <th>Status</th>
            <th>bKash TrxID</th>
            <th>Payment Amount</th>
            <th>Payment Status</th>
            <th>Payment Action</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="registrationRows"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://ctfqtveemhqmtfhjrrri.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_D7E3_PlX7WaxxDBKVXnB-w_LO63lD3r";
const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");
const dashboard = document.getElementById("dashboard");

async function showDashboard() {
  const { data: { user }, error: userError } = await client.auth.getUser();

  if (userError || !user) {
    dashboard.classList.add("hidden");
    loginForm.classList.remove("hidden");
    return;
  }

  const { data: admin, error: adminError } = await client
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (adminError || !admin) {
    await client.auth.signOut();
    dashboard.classList.add("hidden");
    loginForm.classList.remove("hidden");
    message.textContent = "This account is not authorized as an admin.";
    return;
  }

  loginForm.classList.add("hidden");
  dashboard.classList.remove("hidden");
  await loadRegistrations();
  await loadAdminTournaments();
}

async function loadRegistrations() {
  message.textContent = "Loading registrations...";
  const { data, error } = await client
    .from("registrations")
  .select("id, player_name, phone, player_type, tournament_id, address, message, status, bkash_trx_id, payment_amount, payment_status")
    .order("tournament_id", { ascending: false });

  if (error) {
    message.textContent = "Could not load registrations: " + error.message;
    return;
  }

  const tbody = document.getElementById("registrationRows");
  tbody.replaceChildren();

  (data || []).forEach(reg => {
    const tr = document.createElement("tr");
    [
      reg.player_name,
      reg.phone,
      reg.player_type,
      reg.tournament_id,
      reg.address,
      reg.message
    ].forEach(value => {
      const td = document.createElement("td");
      td.textContent = value == null ? "" : String(value);
      tr.appendChild(td);
    });
     const statusCell = document.createElement("td");
    const statusSelect = document.createElement("select");

    ["Pending", "Approved", "Rejected"].forEach(status => {
      const option = document.createElement("option");
      option.value = status;
      option.textContent = status;
      statusSelect.appendChild(option);
    });

    statusSelect.value = reg.status || "Pending";
    statusSelect.dataset.tournamentId = reg.tournament_id;
    statusSelect.dataset.phone = reg.phone;
    statusSelect.dataset.playerName = reg.player_name;

   statusCell.appendChild(statusSelect);
tr.appendChild(statusCell);

// Show bKash Transaction ID
const trxCell = document.createElement("td");
trxCell.textContent = reg.bkash_trx_id || "Not provided";
tr.appendChild(trxCell);

// Show payment amount
const amountCell = document.createElement("td");
amountCell.textContent = "৳" + (reg.payment_amount ?? 100);
tr.appendChild(amountCell);

// Show payment status
const paymentStatusCell = document.createElement("td");
paymentStatusCell.textContent = reg.payment_status || "Pending";
tr.appendChild(paymentStatusCell);

// Payment approval button
const paymentActionCell = document.createElement("td");
const approvePaymentButton = document.createElement("button");

approvePaymentButton.textContent =
  reg.payment_status === "Approved"
    ? "Approved"
    : "Verify & Approve Payment";

approvePaymentButton.disabled =
  reg.payment_status === "Approved";

approvePaymentButton.addEventListener("click", async () => {
  if (!reg.bkash_trx_id) {
    message.textContent = "No bKash Transaction ID provided.";
    return;
  }

  const confirmed = confirm(
    "Have you verified this bKash payment of ৳" +
    (reg.payment_amount ?? 100) +
    " for TrxID " + reg.bkash_trx_id + "?"
  );

  if (!confirmed) return;

  approvePaymentButton.disabled = true;
  message.textContent = "Verifying payment...";

  try {
    const { data: { user }, error: authError } =
      await client.auth.getUser();

    if (authError || !user) {
      throw new Error("Please log in again.");
    }

    const { data: admin, error: adminError } = await client
      .from("admin_users")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

    if (adminError || !admin) {
      throw new Error("Admin permission required.");
    }

    const { data: updatedRows, error: updateError } = await client
      .from("registrations")
      .update({ payment_status: "Approved" })
      .eq("id", reg.id)
      .eq("payment_status", "Pending")
      .select("id");

    if (updateError) throw updateError;

    if (!updatedRows || updatedRows.length === 0) {
      throw new Error(
        "Payment was not updated. Refresh and check its current status."
      );
    }

    message.textContent = "Payment approved successfully.";
    await loadRegistrations();

  } catch (error) {
    message.textContent = "Approval failed: " + error.message;
    approvePaymentButton.disabled = false;
  }
});

paymentActionCell.appendChild(approvePaymentButton);
tr.appendChild(paymentActionCell);

const actionCell = document.createElement("td");
const deleteButton = document.createElement("button");

deleteButton.textContent = "Delete";
deleteButton.style.background = "#dc2626";

deleteButton.addEventListener("click", async () => {
  const confirmed = confirm(
    "Are you sure you want to permanently delete this registration?"
  );

  if (!confirmed) return;

  const { data: { user }, error: authError } =
    await client.auth.getUser();

  if (authError || !user) {
    message.textContent = "Please log in again.";
    return;
  }

  const { data: admin, error: adminError } = await client
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (adminError || !admin) {
    message.textContent = "Admin permission required.";
    return;
  }

  deleteButton.disabled = true;

  const { error } = await client
    .from("registrations")
    .delete()
    .eq("id", reg.id);

  if (error) {
    message.textContent = "Delete failed: " + error.message;
    deleteButton.disabled = false;
    return;
  }

  message.textContent = "Registration deleted successfully.";
  await loadRegistrations();
});

actionCell.appendChild(deleteButton);
tr.appendChild(actionCell);
    tbody.appendChild(tr);
  });

  document.getElementById("count").textContent =
    "Registrations: " + (data || []).length;
  message.textContent = "";
}

loginForm.addEventListener("submit", async event => {
  event.preventDefault();
  message.textContent = "Signing in...";

  const { error } = await client.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  });

  if (error) {
    message.textContent = "Login failed: " + error.message;
    return;
  }

  await showDashboard();
});

document.getElementById("refreshButton").addEventListener("click", loadRegistrations);

document.getElementById("logoutButton").addEventListener("click", async () => {
  await client.auth.signOut();
  dashboard.classList.add("hidden");
  loginForm.classList.remove("hidden");
  message.textContent = "Logged out.";
});

(async () => {
  const { data: { session } } = await client.auth.getSession();
  if (session) await showDashboard();
})();
  document.getElementById("registrationRows")
  .addEventListener("change", async event => {
    const select = event.target;

    if (select.tagName !== "SELECT") return;

    select.disabled = true;
    message.textContent = "Saving status...";

    try {
      const { data: { user }, error: authError } =
        await client.auth.getUser();

      if (authError || !user) {
        throw new Error("Please log in again.");
      }

      // Identify the selected registration using its current fields.
      const { data: matches, error: findError } = await client
        .from("registrations")
        .select("id")
        .eq("tournament_id", Number(select.dataset.tournamentId))
        .eq("phone", select.dataset.phone)
        .eq("player_name", select.dataset.playerName);

      if (findError) throw findError;

      if (!matches || matches.length !== 1) {
        throw new Error(
          "Could not uniquely identify this registration. No status was changed."
        );
      }

      const { error: updateError } = await client
        .from("registrations")
        .update({ status: select.value })
        .eq("id", matches[0].id);

      if (updateError) throw updateError;

      message.textContent = "Status saved: " + select.value;
    } catch (error) {
      message.textContent = "Status save failed: " + error.message;
      await loadRegistrations();
    } finally {
      select.disabled = false;
    }
  });
  
const tournamentForm = document.getElementById("tournamentForm");
const tournamentMessage = document.getElementById("tournamentMessage");
const tournamentRows = document.getElementById("tournamentRows");

async function loadAdminTournaments() {
  const { data, error } = await client
    .from("tournaments")
    .select("id, title, sport, description, registration_fee, registration_deadline, is_published")
    .order("id", { ascending: false });

  if (error) {
    tournamentMessage.textContent = "Load failed: " + error.message;
    return;
  }

  tournamentRows.replaceChildren();

  (data || []).forEach(t => {
    const tr = document.createElement("tr");

    [
      t.title,
      t.sport,
      t.registration_fee ?? 0,
      t.registration_deadline || "—",
      t.is_published ? "Yes" : "No"
    ].forEach(value => {
      const td = document.createElement("td");
      td.textContent = String(value);
      tr.appendChild(td);
    });

    const actions = document.createElement("td");

    const editButton = document.createElement("button");
    editButton.textContent = "Edit";

    editButton.addEventListener("click", async () => {
      const title = prompt("Tournament name:", t.title);
      if (title === null) return;

      const sport = prompt("Sport:", t.sport);
      if (sport === null) return;

      const feeText = prompt("Registration fee:", t.registration_fee ?? 0);
      if (feeText === null) return;

      const fee = Number(feeText);
      if (!title.trim() || !sport.trim() || !Number.isFinite(fee) || fee < 0) {
        alert("Enter a valid name, sport and fee.");
        return;
      }

      const description = prompt("Description:", t.description || "");
      if (description === null) return;

      const deadline = prompt(
        "Deadline (YYYY-MM-DD, or blank):",
        t.registration_deadline || ""
      );
      if (deadline === null) return;

      if (deadline && !/^\d{4}-\d{2}-\d{2}$/.test(deadline)) {
        alert("Enter the date as YYYY-MM-DD.");
        return;
      }

      const { error } = await client
        .from("tournaments")
        .update({
          title: title.trim(),
          sport: sport.trim(),
          registration_fee: fee,
          description: description.trim(),
          registration_deadline: deadline || null
        })
        .eq("id", t.id);

      if (error) {
        tournamentMessage.textContent = "Edit failed: " + error.message;
        return;
      }

      tournamentMessage.textContent = "Tournament updated.";
      await loadAdminTournaments();
    });

    const toggleButton = document.createElement("button");
    toggleButton.textContent = t.is_published
      ? "Close Registration"
      : "Publish";

    toggleButton.addEventListener("click", async () => {
      const nextValue = !t.is_published;

      if (!confirm(
        `Are you sure you want to ${
          nextValue ? "publish" : "close registration for"
        } "${t.title}"?`
      )) return;

      const { error } = await client
        .from("tournaments")
        .update({ is_published: nextValue })
        .eq("id", t.id);

      if (error) {
        tournamentMessage.textContent = "Update failed: " + error.message;
        return;
      }

      tournamentMessage.textContent = nextValue
        ? "Tournament published."
        : "Registration closed.";

      await loadAdminTournaments();
    });

    actions.append(editButton, document.createTextNode(" "), toggleButton);
    tr.appendChild(actions);
    tournamentRows.appendChild(tr);
  });
}

tournamentForm.addEventListener("submit", async event => {
  event.preventDefault();
  tournamentMessage.textContent = "Adding tournament...";

  const title = document.getElementById("tournamentTitle").value.trim();
  const sport = document.getElementById("tournamentSport").value.trim();
  const fee = Number(document.getElementById("tournamentFee").value);
  const deadline =
    document.getElementById("tournamentDeadline").value || null;
  const description =
    document.getElementById("tournamentDescription").value.trim();

  if (!title || !sport || !Number.isFinite(fee) || fee < 0) {
    tournamentMessage.textContent = "Enter a valid name, sport and fee.";
    return;
  }

  const { error } = await client.from("tournaments").insert([{
    title,
    sport,
    registration_fee: fee,
    registration_deadline: deadline,
    description,
    is_published: true
  }]);

  if (error) {
    tournamentMessage.textContent = "Add failed: " + error.message;
    return;
  }

  tournamentForm.reset();
  document.getElementById("tournamentFee").value = 0;
  tournamentMessage.textContent = "Tournament added successfully.";

  await loadAdminTournaments();
});

</script>
</body>
</html>
